name: SkyOS APK Build

on: [push, workflow_dispatch]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Proje zip'liyse cikar
        run: |
          if [ -f SkyOS_Guncellenmis_Proje.zip ]; then
            echo "Zip bulundu — extracted/ icine cikariliyor"
            mkdir -p extracted
            unzip -o SkyOS_Guncellenmis_Proje.zip -d extracted
          fi
          echo "--- Repo koku ---"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK paths
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee /usr/local/lib/android/sdk/licenses/android-sdk-license > /dev/null
          echo "84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee -a /usr/local/lib/android/sdk/licenses/android-sdk-license > /dev/null
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" | sudo tee -a /usr/local/lib/android/sdk/licenses/android-sdk-license > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: |
          WRAPPER=$(find . -type f -name gradlew -not -path "*/.git/*" | sort | head -1)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew bulunamadi"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "Proje dizini: $PROJECT_DIR"
          chmod +x "$WRAPPER"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyOS-debug-apk
          path: |
            extracted/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
