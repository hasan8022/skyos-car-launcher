name: Android CI - SkyOS ET5 APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build SkyOS ET5 Debug APK (Android 9 - 12+ Tablet)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Required Platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure local.properties & Google Maps API Key
        env:
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_KEY" ]; then
            echo "MAPS_API_KEY=$MAPS_KEY" >> local.properties
            echo "MAPS_API_KEY=$MAPS_KEY" > .env
          else
            echo "MAPS_API_KEY=AIzaSyCCEttp3mULooST70ncYa1ZekWhyfVvu3g" >> local.properties
            echo "MAPS_API_KEY=AIzaSyCCEttp3mULooST70ncYa1ZekWhyfVvu3g" > .env
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyOS-ET5-GoogleNav-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
