
name: HasanLauncher APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: HasanLauncher APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ZIP dosyasını aç
      - name: Extract Android Project
        run: |
          if [ ! -f "HasanLauncher-TEMIZ.zip" ]; then
            echo "HATA: HasanLauncher-TEMIZ.zip bulunamadi!"
            ls -la
            exit 1
          fi

          mkdir -p project
          unzip -q HasanLauncher-TEMIZ.zip -d project

          if [ ! -f "project/settings.gradle.kts" ]; then
            echo "HATA: settings.gradle.kts bulunamadi!"
            find project -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP basariyla acildi!"
          ls -la project

      # Android SDK
      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d android-tools

          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          mv android-tools/cmdline-tools/* "$HOME/android-sdk/cmdline-tools/latest/"

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      # SDK paketleri
      - name: Install SDK Packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Gradle 8.7
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # APK oluştur
      - name: Build HasanLauncher APK
        run: |
          gradle -p "$GITHUB_WORKSPACE/project" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # APK yükle
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HasanLauncher-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
