
name: SkyOS APK Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract and Locate Project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)

          if [ -n "$ZIP" ]; then
            mkdir -p extracted
            unzip -oq "$ZIP" -d extracted
          fi

          WRAPPER=$(find . -type f -name gradlew \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew bulunamadi!"
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "Android SDK bulunamadi: $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadi!"
            ls -la "$SDK"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            --install "platform-tools"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyOS-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
